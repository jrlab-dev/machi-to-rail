<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>山海特急の旅｜まちとレール</title><meta name="theme-color" content="#193a39"><link rel="icon" href="data:,"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><style>
*{box-sizing:border-box}body{margin:0;background:#fffaf0;color:#173f3b;font:16px/1.45 system-ui,sans-serif}main{height:100svh;display:grid;grid-template-rows:auto minmax(200px,1fr) auto}header,footer{padding:10px clamp(14px,4vw,48px)}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #d4d3c5}h1{font:700 clamp(19px,3vw,28px) serif;margin:0}a{color:#20534a;font-weight:650}section{position:relative;min-height:0;background:#abcada}canvas{display:block;width:100%;height:100%}.board,.clock{position:absolute;background:#132d31ed;color:#fff7dd;padding:8px 12px;border-radius:5px;top:12px}.board{left:12px;max-width:64%}.clock{right:12px;font-variant-numeric:tabular-nums}small{display:block;font-size:12px}strong{font-size:18px}footer{display:grid;gap:7px}footer>div{display:flex;gap:7px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border:1px solid #879e91;border-radius:7px;color:#173e36;background:#fcfbf4;padding:7px 10px;min-height:40px}button{cursor:pointer}#go{background:#20554a;color:white;font-weight:700}progress{width:100%;height:5px;accent-color:#34715a}#schedule{margin:0;font-size:14px}.clock{font-size:14px}@media(max-width:500px){footer{padding:9px}button,select{font-size:14px}.board{top:8px;left:7px}.clock{top:8px;right:7px}}
dialog{width:min(440px,92vw);max-height:76svh;border:0;border-radius:12px;color:#193a39;background:#fffaf0}dialog::backdrop{background:#172d36a8}dialog header{position:sticky;top:-17px;background:#fffaf0}ol{padding-left:2.2em}li{padding:4px}li span{float:right;font-variant-numeric:tabular-nums}</style></head><body><main><header><h1>山海特急の旅</h1><a href="./">街に戻る</a></header><section><canvas id="view" aria-label="山と海を結ぶ複線の車窓"></canvas><div class="board"><small id="area"></small><strong id="next"></strong></div><div class="clock"><b id="clock"></b><small id="speed"></small></div></section><footer><progress id="progress" aria-label="終着までの進み具合"></progress><p id="schedule"></p><div><select id="service" aria-label="列車"><option value="express">特急・4駅停車</option><option value="local">普通・全20駅</option></select><button id="go">出発する</button><select id="camera" aria-label="視点"><option value="outside">列車を見る</option><option value="cab">前方の車窓</option><option value="side">横の車窓</option></select><select id="rate" aria-label="再生速度"><option value="1">等速</option><option value="4">4倍速</option></select><button id="list">停車駅・時刻</button></div></footer></main><dialog id="times"><header><b>停車駅・時刻</b><button id="close-times">閉じる</button></header><ol id="times-list"></ol></dialog><script type="module" src="./san-kai-ride.mjs"></script></body></html>
