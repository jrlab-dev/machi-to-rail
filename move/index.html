<body><main class="article"><a href="/">まちとレール</a><h1>作品の引っ越し</h1>
<section id="send" hidden><p>このブラウザに保存した街・電車・写真・音・駅広告を、新しい住所へコピーします。これまでの住所でも引き続き遊べます。</p><button id="start">新しい住所へ引っ越す</button><h2>ファイルで運ぶ</h2><p>別の端末で遊ぶときや、新しいタブが開かないときに使えます。</p><button id="download">全作品をファイルに保存</button> <a href="https://rail.jr-genius.jp/move/">新しい住所で読み込む</a></section>
<section id="receive" hidden><p>引っ越した作品には専用の保存庫を用意します。すでにこの住所で作った街や、同じ名前の電車も残ります。</p><a href="https://junior-g-rail.j-kato.chatgpt.site/move/">旧住所にある作品を運ぶ</a><h2>全作品ファイルを読み込む</h2><label>引っ越しファイルを選ぶ <input type="file" id="file" accept=".json,application/json"></label><div id="review" hidden><p id="summary"></p><button id="accept">この作品を受け取る</button></div><h2>遊ぶ保存庫を選ぶ</h2><a href="/play/">この住所でもともと使っている保存庫</a><ul id="collections"></ul></section><p id="status" role="status"></p><a id="play" hidden>受け取った作品で遊ぶ →</a></main><script type="module" src="move.mjs"></script></body></html>
